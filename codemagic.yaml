workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Build iOS with EAS
        script: |
          eas build --platform ios --profile production --non-interactive --wait 2>&1 | tee eas_build.log
          ARTIFACT_URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[^ ]+\.ipa' eas_build.log | tail -1)
          echo "Artifact URL: $ARTIFACT_URL"
          curl -L -o "$CM_BUILD_DIR/magnate.ipa" "$ARTIFACT_URL"
    artifacts:
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android Build - Magnate
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - magnate-variables
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Build Android with EAS
        script: |
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee eas_build.log
          ARTIFACT_URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[^ ]+\.(aab|apk)' eas_build.log | tail -1)
          echo "Artifact URL: $ARTIFACT_URL"
          curl -L -o "$CM_BUILD_DIR/magnate.aab" "$ARTIFACT_URL"
    artifacts:
      - "**/*.apk"
      - "**/*.aab"
