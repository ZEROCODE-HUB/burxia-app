workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      ios_signing:
        provisioning_profiles:
          - Magnate AppStore
          - Magnate OneSignal AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Expo CLI
        script: npm install -g @expo/cli
      - name: Prebuild iOS
        script: npx expo prebuild --platform ios --clean || true
      - name: Show NotificationService
        script: cat ios/OneSignalNotificationServiceExtension/NotificationService.m
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Fix OneSignal deployment target and import
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 11/IPHONEOS_DEPLOYMENT_TARGET = 15/g' ios/Magnate.xcodeproj/project.pbxproj
          sed -i '' 's/#import <OneSignalFramework\/OneSignalFramework.h>/#import <OneSignalXCFramework\/OneSignal.h>/g' ios/OneSignalNotificationServiceExtension/NotificationService.m
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild \
            -project ios/Magnate.xcodeproj \
            -scheme Magnate \
            -configuration Release \
            -archivePath build/Magnate.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project ios/Magnate.xcodeproj \
            --scheme Magnate
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true