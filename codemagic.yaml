workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      ios_signing:
        provisioning_profiles:
          - Magnate AppStore
          - Magnate OneSignal AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Expo CLI
        script: npm install -g @expo/cli
      - name: Prebuild iOS
        script: EXPO_NO_DEV_CLIENT=1 npx expo prebuild --platform ios --clean || true
      - name: Fix OneSignal NotificationService
        script: |
          python3 -c "
          content = '''#import <RCTOneSignalExtensionService.h>
          #import \"NotificationService.h\"

          @interface NotificationService ()
          @property (nonatomic, strong) void (^contentHandler)(UNNotificationContent *contentToDeliver);
          @property (nonatomic, strong) UNNotificationRequest *receivedRequest;
          @property (nonatomic, strong) UNMutableNotificationContent *bestAttemptContent;
          @end

          @implementation NotificationService

          - (void)didReceiveNotificationRequest:(UNNotificationRequest *)request withContentHandler:(void (^)(UNNotificationContent * _Nonnull))contentHandler {
              self.receivedRequest = request;
              self.contentHandler = contentHandler;
              self.bestAttemptContent = [request.content mutableCopy];