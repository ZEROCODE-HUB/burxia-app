workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      ios_signing:
        provisioning_profiles:
          - Magnate AppStore
          - Magnate OneSignal AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Expo CLI
        script: npm install -g @expo/cli
      - name: Prebuild iOS
        script: |
          export EXPO_NO_DEV_CLIENT=1
          export EAS_BUILD_PROFILE=production
          npx expo prebuild --platform ios --clean || true
      - name: Fix Podfile
        script: |
          python3 << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()
          old = "target 'OneSignalNotificationServiceExtension' do\n  pod 'OneSignalXCFramework', '>= 5.0', '< 6.0'\n  use_frameworks!"
          new = "target 'OneSignalNotificationServiceExtension' do\n  inherit! :search_paths\n  pod 'OneSignalXCFramework', '>= 5.0', '< 6.0'\n  use_frameworks!"
          if old in content:
              content = content.replace(old, new)
              print('Podfile patched successfully')
          else:
              print('Pattern not found')
          with open('ios/Podfile', 'w') as f:
              f.write(content)
          PYEOF
      - name: Fix OneSignal NotificationService
        script: cp NotificationService.m ios/OneSignalNotificationServiceExtension/NotificationService.m
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Fix deployment target and xcconfig
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 11/IPHONEOS_DEPLOYMENT_TARGET = 15/g' ios/Magnate.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12/IPHONEOS_DEPLOYMENT_TARGET = 15/g' ios/Magnate.xcodeproj/project.pbxproj
          XCCONFIG="ios/Pods/Target Support Files/Pods-OneSignalNotificationServiceExtension/Pods-OneSignalNotificationServiceExtension.release.xcconfig"
          if [ -f "$XCCONFIG" ]; then
            echo "Found xcconfig, adding react-native-onesignal link flag"
            echo 'OTHER_LDFLAGS = $(inherited) -lreact-native-onesignal' >> "$XCCONFIG"
            cat "$XCCONFIG"
          else
            echo "xcconfig not found, listing available files:"
            ls "ios/Pods/Target Support Files/" | grep -i onesignal
          fi
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace ios/Magnate.xcworkspace \
            -scheme Magnate \
            -configuration Release \
            -archivePath build/Magnate.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/Magnate.xcarchive \
            -exportOptionsPlist $CM_EXPORT_OPTIONS_PATH \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true