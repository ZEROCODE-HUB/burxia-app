workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      ios_signing:
        provisioning_profiles:
          - Magnate AppStore
          - Magnate OneSignal AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Expo CLI
        script: npm install -g @expo/cli
      - name: Prebuild iOS
        script: npx expo prebuild --platform ios --clean
      -