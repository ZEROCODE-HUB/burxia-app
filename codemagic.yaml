workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Build iOS with EAS
        script: |
          eas build --platform ios --profile production --non-interactive --wait --json > eas_build.json
          BUILD_ID=$(node -e "console.log(require('./eas_build.json').id)")
          eas build:download --platform ios --id "$BUILD_ID" || true
    artifacts:
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Android Build - Magnate
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - magnate-variables
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Build Android with EAS
        script: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas_build.json
          BUILD_ID=$(node -e "console.log(require('./eas_build.json').id)")
          eas build:download --platform android --id "$BUILD_ID" || true
    artifacts:
      - "**/*.apk"
      - "**/*.aab"
