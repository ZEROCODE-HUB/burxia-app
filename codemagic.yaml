workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      groups:
        - magnate-variables
      ios_signing:
        provisioning_profiles:
          - Magnate AppStore
          - Magnate OneSignal AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Expo CLI
        script: npm install -g @expo/cli
      - name: Prebuild iOS
        script: |
          export EXPO_NO_DEV_CLIENT=1
          export EAS_BUILD_PROFILE=production
          npx expo prebuild --platform ios --clean || true
      - name: Fix Podfile
        script: |
          python3 << 'PYEOF'
          with open('ios/Podfile', 'r') as f:
              content = f.read()
          old = "  post_install do |installer|\n    react_native_post_install("
          new = """  post_install do |installer|
            installer.pods_project.targets.each do |target|
              if target.name == 'Pods-OneSignalNotificationServiceExtension'
                target.build_configurations.each do |config|
                  config.build_settings['OTHER_LDFLAGS'] ||= ['$(inherited)']
                  config.build_settings['OTHER_LDFLAGS'] << '-lreact-native-onesignal'
                end
              end
            end
            react_native_post_install("""
          if old in content:
              content = content.replace(old, new)
              print('Post install hook added successfully')
          else:
              print('Pattern not found, showing end of file:')
              print(content[-500:])
          with open('ios/Podfile', 'w') as f:
              f.write(content)
          PYEOF
      - name: Fix OneSignal NotificationService
        script: cp NotificationService.m ios/OneSignalNotificationServiceExtension/NotificationService.m
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Fix deployment target
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 11/IPHONEOS_DEPLOYMENT_TARGET = 15/g' ios/Magnate.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12/IPHONEOS_DEPLOYMENT_TARGET = 15/g' ios/Magnate.xcodeproj/project.pbxproj
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace ios/Magnate.xcworkspace \
            -scheme Magnate \
            -configuration Release \
            -archivePath build/Magnate.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/Magnate.xcarchive \
            -exportOptionsPlist $CM_EXPORT_OPTIONS_PATH \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true