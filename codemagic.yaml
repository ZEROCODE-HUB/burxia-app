workflows:
  ios-workflow:
    name: iOS Build - Magnate
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      ios_signing:
        provisioning_profiles:
          - Magnate AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
      vars:
        XCODE_SCHEME: Magnate
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Setup EAS
        script: npm install -g eas-cli
      - name: Build iOS
        script: |
          export EXPO_TOKEN=$EXPO_TOKEN
          eas build --platform ios --profile production --non-interactive --local
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true